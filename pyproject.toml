[project]
name = "frederick-draft"
version = "0.1.0"
description = "Evidence-backed brewery data pipeline for Frederick County, Maryland"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "polars>=1.0",
    "pydantic>=2.8",
    "python-dateutil>=2.9",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
frederick-draft = "frederick_draft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frederick_draft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
